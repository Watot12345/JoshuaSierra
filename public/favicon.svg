<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- Red gradient background accent -->
  <rect width="32" height="32" rx="7" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- Crisp border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#dc2626" stroke-opacity="0.5"/>
  <!-- J letter -->
  <text x="4" y="23" font-family="'Geist', 'Inter', Arial, sans-serif" font-size="17" font-weight="800" fill="#dc2626" letter-spacing="-1">J</text>
  <!-- S letter -->
  <text x="14" y="23" font-family="'Geist', 'Inter', Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="-1">S</text>
</svg>
