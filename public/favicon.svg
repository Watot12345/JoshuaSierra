<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Sleek dark background -->
  <rect width="48" height="48" rx="10" fill="#0d0f14"/>
  <!-- Emerald accent border -->
  <rect x="1" y="1" width="46" height="46" rx="9" stroke="#10b981" stroke-opacity="0.8" stroke-width="2"/>
  <!-- Subtle inner glow -->
  <rect x="2" y="2" width="44" height="44" rx="8" stroke="#34d399" stroke-opacity="0.2" stroke-width="1"/>
  <!-- J letter in emerald -->
  <text x="9" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#10b981" letter-spacing="-1">J</text>
  <!-- S letter in crisp white -->
  <text x="23" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-1">S</text>
</svg>
